            <text><textPath href="#bar2" textLength="680" lengthAdjust="spacing">MONEY TALKS · MONEY TALKS · MONEY TALKS · MONEY TALKS · MONEY TALKS · MONEY TALKS · MONEY TALKS</textPath></text>

        <g fill="#1a8a3e">
            <text font-size="15" transform="translate(-26 0)">
            <textPath href="#s" textLength="1450" lengthAdjust="spacing">Money, the long green, cash, stash, rhino, jack or just plain dough. Chock it up, fork it over, shell it out. Watch it burn holes through pockets.</textPath>
            </text>
            <text font-size="14" font-weight="bold">
            <textPath href="#s" textLength="1450" lengthAdjust="spacing">To be made of it! To have it to burn! Greenbacks, double eagles, megabucks and Ginnie Maes. It greases the palm, feathers a nest, holds heads above water, makes both ends meet.</textPath>
            </text>
            <text font-size="15" transform="translate(26 0)">
            <textPath href="#s" textLength="1450" lengthAdjust="spacing">Money breeds money. Gathering interest, compounding daily. Always in circulation. Money. You don’t know where it’s been, but you put it where your mouth is. And it talks.</textPath>
            </text>
        </g>
